# optimos.075codes.com: the OptimosApp landing page (static files from `pnpm build`).
# Lives in its own file and only claims its own hostname, like the other single-site files on this
# box. The HTTPS part (listen 443, certificate lines, HTTP->HTTPS redirect) is added by
#   certbot --nginx -d optimos.075codes.com
# so keep that block in sync if this file is ever reapplied from scratch.
server {
    listen 80;
    listen [::]:80;
    server_name optimos.075codes.com;

    root /var/www/optimos;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Fingerprinted build assets never change under the same name.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    error_page 404 /404.html;
}
