    <path d="M 660 768 L 756 768 C 762.627 768 768 762.627 768 756 L 768 660" />
  </g>

  <!-- Subtle Inward Compression Arrows -->
  <g stroke="#4E4E56" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <line x1="512" y1="232" x2="512" y2="302" />
    <polyline points="482,276 512,306 542,276" />
    <line x1="512" y1="792" x2="512" y2="722" />
