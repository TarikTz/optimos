<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" fill="none">
  <defs>
    <linearGradient id="bgGradFlat" x1="512" y1="32" x2="512" y2="992" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#27272B" />
      <stop offset="100%" stop-color="#141416" />
    </linearGradient>
    <linearGradient id="rimGradFlat" x1="512" y1="32" x2="512" y2="992" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.38" />
